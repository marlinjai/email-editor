# Continuous integration for every pull request and every push to main.
#
# - service: typecheck, unit tests, integration tests against a real Postgres 17
#   service container (and stripe-mock for the Stripe client), and the build of
#   apps/service (the mail service).
# - dashboard: typecheck, unit tests, the production build, and the Playwright
#   end-to-end suite against the real service and worker on Postgres 17.
# - dashboard-image: the dashboard's container image for linux/arm64.
# - service-image: builds the service's container image for linux/arm64 (the
#   shared Coolify server's architecture) without pushing it, so a broken
#   Dockerfile fails the pull request instead of the deploy.
# - roadmap-check: ROADMAP.md and docs/plans/ agree, and every open line is fresh.
name: Verify

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  service:
    name: Service (typecheck, unit, integration, build)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: mail
          POSTGRES_PASSWORD: mail
          POSTGRES_DB: mail
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mail"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      # Stripe's own mock, validating requests against Stripe's OpenAPI
      # description (test/integration/stripe-mock.test.ts).
      stripe-mock:
        image: stripe/stripe-mock:latest
        ports:
          - 12111:12111
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter @email-editor/service...
      # The workspace packages the service imports (the API contract) are
      # consumed from their build output, so they build first.
      - name: Build dependencies
        run: pnpm --filter "@email-editor/service^..." build
      - name: Typecheck
        run: pnpm --filter @email-editor/service lint
      - name: Unit tests
        run: pnpm --filter @email-editor/service test:unit
      # TEST_DATABASE_URL points the suite at the service container. Without it
      # the suite fails loudly rather than skipping.
      - name: Integration tests (Postgres 17)
        env:
          TEST_DATABASE_URL: postgres://mail:mail@localhost:5432/mail
          STRIPE_MOCK_URL: http://localhost:12111
        run: pnpm --filter @email-editor/service test:integration
      - name: Build
        run: pnpm --filter @email-editor/service build

  dashboard:
    name: Dashboard (typecheck, unit, build, end to end)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: mail
          POSTGRES_PASSWORD: mail
          POSTGRES_DB: mail
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mail"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter @email-editor/dashboard... --filter @email-editor/service...
      # The workspace packages the dashboard and the service import are consumed
      # from their build output, so they build first.
      - name: Build dependencies
        run: pnpm --filter "@email-editor/dashboard^..." --filter "@email-editor/service^..." build
      - name: Typecheck
        run: pnpm --filter @email-editor/dashboard lint
      - name: Unit tests
        run: pnpm --filter @email-editor/dashboard test
      # A production build, never with MAIL_DASHBOARD_TEST_AUTH set (next.config
      # refuses to build with it). The end-to-end suite's production guard
      # starts this build's servers to prove they refuse the flag.
      - name: Build
        run: pnpm --filter @email-editor/dashboard build
      - name: Build the mail service (the end-to-end suite runs it)
        run: pnpm --filter @email-editor/service build
      - name: Install Chromium
        run: pnpm --filter @email-editor/dashboard exec playwright install --with-deps chromium
      # TEST_DATABASE_URL points the stack at the service container instead of
      # Testcontainers. The sign-in bypass is enabled for the dev server the
      # suite starts, inside its own config, never in this job's environment.
      - name: End to end (Playwright)
        env:
          TEST_DATABASE_URL: postgres://mail:mail@localhost:5432/mail
          CI: 'true'
        run: pnpm --filter @email-editor/dashboard test:e2e
      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/dashboard/playwright-report
            apps/dashboard/test-results
          retention-days: 7

  dashboard-image:
    name: Dashboard image builds (linux/arm64)
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/dashboard/Dockerfile
          platforms: linux/arm64
          push: false
          cache-from: type=gha,scope=dashboard
          cache-to: type=gha,scope=dashboard,mode=max

  service-image:
    name: Service image builds (linux/arm64)
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/service/Dockerfile
          platforms: linux/arm64
          push: false
          cache-from: type=gha,scope=service
          cache-to: type=gha,scope=service,mode=max

  roadmap-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: marlinjai/actions-shared/roadmap-check@roadmap-check-v1
        with:
          max-age: 30
