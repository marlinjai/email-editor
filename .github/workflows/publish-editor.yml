name: Publish editor packages

# Publishes @marlinjai/email-editor-core, -blocks, -ui and @marlinjai/email-editor
# to npm when a tag editor-v<version> is pushed (for example editor-v0.1.0).
#
# Authentication is npm Trusted Publishing (OpenID Connect): no npm token is
# stored anywhere. Each package must be registered once on npmjs.com with this
# repository and this workflow file (publish-editor.yml) as its trusted
# publisher. Until it is, the upload fails with a 404 on PUT for that package.
#
# Re-running after a partial failure is safe: a version already on the
# registry is skipped, the rest are published.

on:
  push:
    tags:
      - 'editor-v*'

permissions:
  contents: read
  id-token: write # npm Trusted Publishing (OIDC), and provenance

concurrency:
  group: publish-editor
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'
      - name: Install an npm CLI that supports Trusted Publishing (11.5.1 or newer)
        run: npm install -g npm@latest && npm --version

      - name: Check the tag matches every package version
        id: version
        run: |
          version="${GITHUB_REF_NAME#editor-v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          for dir in core blocks ui editor; do
            actual=$(node -p "require('./packages/$dir/package.json').version")
            if [ "$actual" != "$version" ]; then
              echo "::error::packages/$dir is at $actual but the tag is $GITHUB_REF_NAME. Bump the version or fix the tag."
              exit 1
            fi
          done

      - run: pnpm install --frozen-lockfile

      - name: Typecheck, test and build
        run: pnpm turbo run lint test build --filter=@marlinjai/email-editor...

      - name: Pack and check the tarballs
        run: node scripts/check-packed-manifests.mjs --version "${{ steps.version.outputs.version }}" --out "$RUNNER_TEMP/tarballs"

      - name: Publish (core, blocks, ui, editor, in dependency order)
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          for name in email-editor-core email-editor-blocks email-editor-ui email-editor; do
            pkg="@marlinjai/$name"
            if npm view "$pkg@$VERSION" version >/dev/null 2>&1; then
              echo "$pkg@$VERSION is already on the registry, skipping"
              continue
            fi
            npm publish "$RUNNER_TEMP/tarballs/marlinjai-$name-$VERSION.tgz" --access public --provenance
          done
