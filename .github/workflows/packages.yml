name: Published packages

# Proves on every pull request that every package this repository publishes
# (the release sets in scripts/release-sets.mjs: the four editor packages, and
# mail-contract with mail-sdk) typechecks, passes its tests, builds, and packs
# into tarballs that are publishable as they are. The editor is also built
# inside a real Next.js 16 + React 19 + Tailwind CSS 4 host (examples/nextjs).

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: packages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Typecheck, test and build the published packages and the example host
        run: >-
          node scripts/release-sets.mjs --all
          | sed 's/.*/--filter=&.../'
          | xargs pnpm turbo run lint test build --filter=email-editor-nextjs-example

      - name: Check the packed tarballs of every release set
        run: node scripts/check-packed-manifests.mjs
